    <title>NavIC · CBTMS</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('navic-theme') || 'system';
          if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (error) { /* The app's theme provider applies the stored theme after startup. */ }
      })();
    </script>
